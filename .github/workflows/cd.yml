# Workflow de Integração Contínua focado em testes unitários
# Estrutura preparada para expansão futura (ex: novos jobs, stages, ambientes)

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  # Variáveis de ambiente utilizadas no workflow
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: dicomonteiros-projects
  TD_TOKEN: ${{ secrets.TD_TOKEN }}
  DATABASE_URL: ${{ secrets.DATABASE_PREVIEW_URL }}
  VITE_SUPABASE_PREVIEW_URL: ${{ secrets.VITE_SUPABASE_PREVIEW_URL }}
  VITE_SUPABASE_PUBLISHABLE_PREVIEW_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_PREVIEW_KEY }}
  
jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Clona o repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências com base no yarn.lock
      - name: Install dependencies
        run: yarn install

      # 5. Executa os testes unitários com Vitest
      - name: Run unit tests
        run: yarn test

  build-and-deploy-preview:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      vercel-preview-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # 1. Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Obter as configurações do vercel (Preview)
      - name: Pull Vercel Config
        run: |
          yarn vercel pull --yes \
          --environment=preview \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE

      # 6. Build para o Vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN
        env:
          VITE_VERCEL_ENV: preview

      # 7. Deploy preview no vercel
      - name: Deploy preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt \
          --target=preview \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy-preview]
    runs-on: ubuntu-latest

    steps:
      # 1. Clona o repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências com base no yarn.lock
      - name: Install dependencies
        run: yarn install

      # 5. Instalação do Chromium
      - name: Install Plawright Browser
        run: yarn playwright install --with-deps chromium

      # 6. Execução dos Testes E2E Completos na URL de Preview da Vercel (ambiente de testes)
      - name: Run E2E Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy-preview.outputs.vercel-preview-url }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          VITE_VERCEL_ENV: preview
          VITE_SUPABASE_PREVIEW_URL: ${{ env.VITE_SUPABASE_PREVIEW_URL }}
          VITE_SUPABASE_PUBLISHABLE_PREVIEW_KEY: ${{ env.VITE_SUPABASE_PUBLISHABLE_PREVIEW_KEY }}

      # 8. Relatório de Testes Automatizados
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report

      # 9. Publicar report JSON no TestDino
      - name: Publish TestDino Report
        if: ${{ !cancelled() }}
        run: npx tdpw upload ./playwright-report --token=${{ env.TD_TOKEN }}

  deploy-production:
    name: Deploy to Production
    needs: [build-and-deploy-preview, e2e-tests]
    runs-on: ubuntu-latest
    
    steps:
      # 1. Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Obter as configurações do vercel (Production)
      - name: Pull Vercel Config
        run: |
          yarn vercel pull --yes \
          --environment=production \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE

      # 6. Build para o Vercel (Production) com variável de produção para que o Supabase use chaves adequadas
      - name: Build Vercel
        run: yarn vercel build --prod --token=$VERCEL_TOKEN
        env:
          VITE_VERCEL_ENV: production

      # 7. Deploy em produção
      - name: Deploy Production
        run: |
          yarn --silent vercel deploy --prebuilt --prod \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE
      

